name: CI

# Build the server with warnings as errors and run the CTest suite. The
# image job boot-proofs the same Dockerfile publishing uses. The proto job
# holds the wire contract to buf lint and buf format. The GCC job is the
# one Forgejo runs; GitHub also boot-proofs the image on pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test (GCC 15)
    runs-on: ubuntu-latest
    container: gcc:15
    timeout-minutes: 180
    steps:
      - name: Install Bun for Forgejo actions
        if: ${{ github.server_url != 'https://github.com' }}
        env:
          BUN_VERSION: 1.4.4
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl unzip
          case "$(uname -m)" in
            x86_64) target=bun-linux-x64-baseline; checksum=e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76 ;;
            aarch64) target=bun-linux-aarch64; checksum=baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e ;;
            *) echo 'Unsupported Bun architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${target}.zip" -o /tmp/bun.zip
          echo "${checksum}  /tmp/bun.zip" | sha256sum --check
          unzip -q /tmp/bun.zip -d /tmp/lighton-bun
          install /tmp/lighton-bun/${target}/bun /usr/local/bin/bun
          ln -s /usr/local/bin/bun /usr/local/bin/node
          bun --version
          node -e 'if (!process.versions.bun) process.exit(1)'
      - uses: actions/checkout@v7
      - name: Install CMake and Ninja
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIGHTON_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  image:
    name: Image boot-proof (linux/amd64)
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build (runs the test suite in the build stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: grpc-lighton-ocr:ci
      - name: Boot-proof the image
        run: ./scripts/smoke-test.sh grpc-lighton-ocr:ci

  proto:
    name: buf lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.71.0
          checksum: d3de2838c68a5759ca276884254bc70df4e4ad185d6ed5f65f327b6ce6363eab
          lint: true
          format: true
          breaking: false
          push: false
          pr_comment: false
