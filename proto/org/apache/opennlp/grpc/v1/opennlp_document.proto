syntax = "proto3";

package org.apache.opennlp.grpc.v1;

import "google/protobuf/struct.proto";

option java_multiple_files = true;
// Explicit outer classname: without it, protoc derives "OpennlpDocument" from
// the filename, which collides with the OpenNlpDocument message on
// case-insensitive filesystems (macOS, Windows).
option java_outer_classname = "OpenNlpDocumentProto";
option java_package = "org.apache.opennlp.grpc.v1";

// The closed stemmer families supported by the service. Defined in the document
// contract so typed stem annotations can retain their producer configuration.
enum StemmerAlgorithm {
  STEMMER_ALGORITHM_UNSPECIFIED = 0;
  STEMMER_ALGORITHM_SNOWBALL = 1;
  STEMMER_ALGORITHM_PORTER = 2;
  STEMMER_ALGORITHM_LIGHT = 3;
  STEMMER_ALGORITHM_MINIMAL = 4;
  STEMMER_ALGORITHM_HUNSPELL = 5;
}

message OpenNlpDocument {
  string doc_id = 1;
  string raw_text = 2;
  optional string detected_language = 3;
  optional float language_confidence = 4;
  repeated LanguageScore ranked_languages = 15;
  repeated AnnotatedSentence sentences = 5;
  optional DocumentAnalytics analytics = 6;
  google.protobuf.Struct metadata = 7;
  repeated EmbeddingResult embeddings = 8;
  optional DocumentClassification classification = 9;
  repeated ChunkEmbeddingGroup chunk_embedding_groups = 10;
  OffsetEncoding offset_encoding = 11;
  repeated EmbeddingResult document_centroids = 12;
  optional NormalizationResult normalization = 13;
  DocumentLayers layers = 14;
}

message LanguageScore {
  string language = 1;
  float confidence = 2;
}

message AnnotatedSentence {
  AnnotationSpan sentence_span = 1;
  repeated Token tokens = 2;
  repeated NamedEntity entities = 3;
  optional ChunkResult syntactic_chunks = 4;
  optional ParseTree parse_tree = 5;
  optional string sentiment_label = 6;
  optional float sentiment_confidence = 7;
  repeated ParseTree parse_trees = 8;
}

message Token {
  string text = 1;
  AnnotationSpan annotation_span = 2;
  optional string pos_tag = 3;
  optional string lemma = 4;
  optional float pos_probability = 5;
  optional string word_type = 6;
  map<string, string> term_layers = 7;
  bool is_stopword = 8;
}

message NamedEntity {
  AnnotationSpan annotation_span = 1;
  string entity_type = 2;
  optional double probability = 3;
  string text = 4;
  repeated EntitySource sources = 5;
  reserved 6 to 9;
  optional GeoResolutionResult geo = 10;
  reserved 11 to 19;
}

message GeoResolutionResult {
  string source = 1;
  string record_id = 2;
  string name = 3;
  double latitude = 4;
  double longitude = 5;
  optional string country_code = 6;
  repeated string containment = 7;
  int64 population = 8;
  optional string feature_class = 9;
  double confidence = 10;
}

message EntitySource {
  string recognizer_id = 1;
  string engine = 2;
  optional double probability = 3;
  optional AnnotationSpan annotation_span = 4;
}

message AnnotationSpan {
  int32 start = 1;
  int32 end = 2;
  CoordinateSpace space = 3;
  optional string type = 4;
  optional double probability = 5;
}

enum CoordinateSpace {
  COORDINATE_SPACE_UNSPECIFIED = 0;
  COORDINATE_SPACE_CHAR_DOCUMENT = 1;
  COORDINATE_SPACE_TOKEN_SENTENCE = 2;
}

enum OffsetEncoding {
  OFFSET_ENCODING_UNSPECIFIED = 0;
  OFFSET_ENCODING_UTF8_BYTE = 1;
  OFFSET_ENCODING_UTF16_CODE_UNIT = 2;
  OFFSET_ENCODING_UNICODE_CODE_POINT = 3;
}

message DocumentAnalytics {
  int32 total_tokens = 1;
  int32 total_sentences = 2;
  float noun_density = 3;
  float verb_density = 4;
  float adjective_density = 5;
  float adverb_density = 6;
  float content_word_ratio = 7;
  int32 unique_lemma_count = 8;
  float lexical_density = 9;
}

message ChunkResult { repeated ChunkSpan chunks = 1; }
message ChunkSpan {
  AnnotationSpan annotation_span = 1;
  string chunk_tag = 2;
  string text = 3;
  repeated ChunkSource sources = 4;
}
message ChunkSource {
  string chunker_id = 1;
  string engine = 2;
  optional AnnotationSpan annotation_span = 3;
}
message Chunk {
  AnnotationSpan annotation_span = 1;
  optional string chunk_tag = 2;
  optional string text_content = 3;
  repeated EmbeddingResult embeddings = 4;
  repeated int32 contained_sentence_indices = 5;
}
enum StandardChunkingStrategy {
  STANDARD_CHUNKING_STRATEGY_UNSPECIFIED = 0;
  STANDARD_CHUNKING_STRATEGY_SENTENCE = 1;
  STANDARD_CHUNKING_STRATEGY_TOKEN = 2;
  STANDARD_CHUNKING_STRATEGY_SEMANTIC = 3;
  STANDARD_CHUNKING_STRATEGY_CATEGORY = 4;
}
message ChunkingStrategySelector {
  oneof kind {
    StandardChunkingStrategy standard = 1;
    string custom = 2;
  }
}
message ChunkEmbeddingGroup {
  string group_id = 1;
  optional string chunk_config_id = 2;
  repeated string embedding_model_ids = 3;
  optional string result_set_name = 4;
  repeated Chunk chunks = 5;
  optional ChunkGroupStats stats = 6;
  optional EmbeddingGranularity granularity = 7;
  repeated EmbeddingResult centroids = 8;
  ChunkingStrategySelector strategy = 9;
}
message ChunkGroupStats {
  int32 chunk_count = 1;
  int32 total_tokens = 2;
  int64 processing_time_ms = 3;
}
message ParseTree {
  ParseNode root = 1;
  optional string penn_treebank = 2;
  string parser_id = 3;
  string engine = 4;
}
message ParseNode {
  string label = 1;
  AnnotationSpan span = 2;
  repeated ParseNode children = 3;
  optional double probability = 4;
  ParseNodeKind kind = 5;
  optional int32 token_index = 6;
}
enum ParseNodeKind {
  PARSE_NODE_KIND_UNSPECIFIED = 0;
  PARSE_NODE_KIND_NONTERMINAL = 1;
  PARSE_NODE_KIND_TERMINAL = 2;
}
enum StandardEmbeddingBackend {
  STANDARD_EMBEDDING_BACKEND_UNSPECIFIED = 0;
  STANDARD_EMBEDDING_BACKEND_ONNX = 1;
  STANDARD_EMBEDDING_BACKEND_CUDA = 2;
  STANDARD_EMBEDDING_BACKEND_STATIC = 3;
  STANDARD_EMBEDDING_BACKEND_TEI = 4;
  STANDARD_EMBEDDING_BACKEND_OPENVINO = 5;
}
message EmbeddingBackendSelector {
  oneof kind {
    StandardEmbeddingBackend standard = 1;
    string custom = 2;
  }
}
message EmbeddingSelector {
  string model_id = 1;
  optional string backend_id = 2;
  EmbeddingBackendSelector backend = 3;
}
message EmbeddingRoute {
  string model_id = 1;
  string backend_id = 2;
  string vector_space_id = 3;
  optional string artifact_hash = 4;
  int32 priority = 5;
  bool primary = 6;
}
message EmbeddingResult {
  string model_id = 1;
  repeated float vector = 2;
  AnnotationSpan source_span = 3;
  EmbeddingGranularity granularity = 4;
  optional EmbeddingRoute route = 5;
  VectorNormalization vector_normalization = 6;
}
enum VectorNormalization {
  VECTOR_NORMALIZATION_UNSPECIFIED = 0;
  VECTOR_NORMALIZATION_NONE = 1;
  VECTOR_NORMALIZATION_L2 = 2;
}
enum EmbeddingGranularity {
  EMBEDDING_GRANULARITY_UNSPECIFIED = 0;
  EMBEDDING_GRANULARITY_DOCUMENT = 1;
  EMBEDDING_GRANULARITY_SENTENCE = 2;
  EMBEDDING_GRANULARITY_CHUNK_LEVEL = 3;
  reserved 4 to 10;
  EMBEDDING_GRANULARITY_GROUP_CENTROID = 11;
}
message NormalizationResult {
  string normalized_text = 1;
  repeated AlignmentRun alignment = 2;
  repeated string applied_normalizers = 3;
}
message AlignmentRun {
  int32 original_units = 1;
  int32 normalized_units = 2;
  bool equal = 3;
}
message DocumentClassification {
  string best_category = 1;
  map<string, double> category_scores = 2;
}
message DocumentLayers { repeated AnnotationLayer layers = 1; }
enum StandardLayer {
  STANDARD_LAYER_UNSPECIFIED = 0;
  STANDARD_LAYER_SENTENCES = 1;
  STANDARD_LAYER_TOKENS = 2;
  STANDARD_LAYER_POS_TAGS = 3;
  STANDARD_LAYER_LEMMAS = 4;
  STANDARD_LAYER_ENTITIES = 5;
  STANDARD_LAYER_SYNTACTIC_CHUNKS = 6;
  STANDARD_LAYER_PARSES = 7;
  STANDARD_LAYER_SENTIMENT = 8;
  STANDARD_LAYER_LANGUAGE = 9;
  STANDARD_LAYER_CATEGORIES = 10;
  STANDARD_LAYER_EMBEDDINGS = 11;
  STANDARD_LAYER_WORD_TYPES = 12;
  STANDARD_LAYER_STOPWORDS = 13;
  STANDARD_LAYER_TERMS = 14;
  STANDARD_LAYER_SUBWORDS = 15;
  STANDARD_LAYER_STEMS = 16;
  STANDARD_LAYER_EXPANSIONS = 17;
  STANDARD_LAYER_GEO = 18;
  STANDARD_LAYER_NORMALIZATION = 19;
  STANDARD_LAYER_ANALYTICS = 20;
  STANDARD_LAYER_CHUNK_GROUPS = 21;
  STANDARD_LAYER_TERM_VECTORS = 22;
  STANDARD_LAYER_DEPENDENCIES = 23;
  STANDARD_LAYER_RELATIONS = 24;
}
enum TermVectorMode {
  TERM_VECTOR_MODE_UNSPECIFIED = 0;
  TERM_VECTOR_MODE_FULL = 1;
  TERM_VECTOR_MODE_SCORING_ONLY = 2;
}
message LayerIdentity {
  oneof kind {
    StandardLayer standard = 1;
    string custom = 2;
  }
  optional string qualifier = 3;
}
message AnnotationLayer {
  string id = 1;
  LayerScope scope = 2;
  oneof values {
    StringAnnotationList string_values = 3;
    CategoryAnnotationList category_values = 4;
    EmbeddingAnnotationList embedding_values = 5;
    TreeAnnotationList tree_values = 6;
    SubwordAnnotationList subword_values = 7;
    GeoAnnotationList geo_values = 8;
    WordTypeAnnotationList word_type_values = 9;
    EntityAnnotationList entity_values = 10;
    SyntacticChunkAnnotationList syntactic_chunk_values = 11;
    StemAnnotationList stem_values = 12;
    LexicalExpansionAnnotationList lexical_expansion_values = 13;
    NormalizationAnnotationList normalization_values = 14;
    AnalyticsAnnotationList analytics_values = 15;
    ChunkGroupAnnotationList chunk_group_values = 16;
    TermVectorAnnotationList term_vector_values = 18;
    DependencyAnnotationList dependency_values = 19;
    RelationAnnotationList relation_values = 20;
  }
  LayerIdentity identity = 17;
}
enum LayerScope {
  LAYER_SCOPE_UNSPECIFIED = 0;
  LAYER_SCOPE_POSITIONAL = 1;
  LAYER_SCOPE_DOCUMENT = 2;
}
message StringAnnotationList { repeated StringAnnotation annotations = 1; }
message StringAnnotation {
  optional AnnotationSpan span = 1;
  string value = 2;
  optional double probability = 3;
}
message CategoryAnnotationList { repeated CategoryAnnotation annotations = 1; }
message CategoryAnnotation {
  optional AnnotationSpan span = 1;
  string label = 2;
  double score = 3;
}
message EmbeddingAnnotationList { repeated EmbeddingAnnotation annotations = 1; }
message EmbeddingAnnotation {
  optional AnnotationSpan span = 1;
  string model_id = 2;
  repeated float vector = 3;
  EmbeddingGranularity granularity = 4;
  optional EmbeddingRoute route = 5;
  VectorNormalization vector_normalization = 6;
}
message SubwordAnnotationList { repeated SubwordAnnotation annotations = 1; }
message SubwordAnnotation {
  AnnotationSpan span = 1;
  string piece = 2;
  int32 vocabulary_id = 3;
}
message GeoAnnotationList { repeated GeoAnnotation annotations = 1; }
message GeoAnnotation {
  AnnotationSpan span = 1;
  GeoResolutionResult resolution = 2;
}
message TreeAnnotationList { repeated TreeAnnotation annotations = 1; }
message TreeAnnotation {
  AnnotationSpan span = 1;
  ParseTree tree = 2;
  repeated ParseTree alternatives = 3;
}
enum DocumentWordType {
  DOCUMENT_WORD_TYPE_UNSPECIFIED = 0;
  DOCUMENT_WORD_TYPE_ALPHANUMERIC = 1;
  DOCUMENT_WORD_TYPE_NUMERIC = 2;
  DOCUMENT_WORD_TYPE_IDEOGRAPHIC = 3;
  DOCUMENT_WORD_TYPE_HIRAGANA = 4;
  DOCUMENT_WORD_TYPE_KATAKANA = 5;
  DOCUMENT_WORD_TYPE_HANGUL = 6;
  DOCUMENT_WORD_TYPE_SOUTHEAST_ASIAN = 7;
  DOCUMENT_WORD_TYPE_EMOJI = 8;
}
message WordTypeAnnotationList { repeated WordTypeAnnotation annotations = 1; }
message WordTypeAnnotation {
  AnnotationSpan span = 1;
  DocumentWordType type = 2;
}
message EntityAnnotationList { repeated NamedEntity annotations = 1; }
message SyntacticChunkAnnotationList { repeated ChunkSpan annotations = 1; }
message StemAnnotationList { repeated StemAnnotation annotations = 1; }
message StemAnnotation {
  AnnotationSpan span = 1;
  string stem = 2;
  StemmerAlgorithm algorithm = 3;
  optional string language = 4;
  optional string hunspell_dictionary_id = 5;
}
enum LexicalExpansionKind {
  LEXICAL_EXPANSION_KIND_UNSPECIFIED = 0;
  LEXICAL_EXPANSION_KIND_SYNONYM = 1;
  LEXICAL_EXPANSION_KIND_HYPERNYM = 2;
  LEXICAL_EXPANSION_KIND_HYPONYM = 3;
}
message LexicalExpansionAnnotationList { repeated LexicalExpansionAnnotation annotations = 1; }
message LexicalExpansionAnnotation {
  AnnotationSpan span = 1;
  string term = 2;
  LexicalExpansionKind kind = 3;
  int32 depth = 4;
  int32 sense_rank = 5;
  double weight = 6;
  string lexicon_id = 7;
}
message NormalizationAnnotationList { repeated NormalizationResult annotations = 1; }
message AnalyticsAnnotationList { repeated DocumentAnalytics annotations = 1; }
message ChunkGroupAnnotationList { repeated ChunkEmbeddingGroup annotations = 1; }
message TermVectorAnnotationList {
  repeated TermVectorAnnotation annotations = 1;
  TermVectorMode mode = 2;
  LayerIdentity source_layer = 3;
}
message TermVectorAnnotation {
  string term = 1;
  int32 frequency = 2;
  repeated AnnotationSpan occurrences = 3;
}
message DependencyAnnotationList {
  repeated DependencyAnnotation annotations = 1;
  string parser_id = 2;
  string engine = 3;
}
message DependencyAnnotation {
  AnnotationSpan span = 1;
  int32 head_token_index = 2;
  int32 dependent_token_index = 3;
  string relation = 4;
}
message RelationAnnotationList { repeated RelationAnnotation annotations = 1; }
message RelationAnnotation {
  AnnotationSpan span = 1;
  string type = 2;
  int32 subject_entity_index = 3;
  int32 object_entity_index = 4;
}
